name: Deploy Dev Branch

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ Charge la clé privée + known_hosts
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      # ✅ Test connexion (utile pour diagnostiquer)
      - name: Test SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "echo CONNECTED && whoami && hostname"

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'EOF'
            set -e

            cd /opt/batix/apps/dev/batix_Saas

            git fetch origin
            git reset --hard origin/dev

            docker compose exec -T app composer install --no-interaction --prefer-dist --optimize-autoloader
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize:clear

            rm -rf public/build
            docker compose run --rm node

            docker compose restart web app
          EOF
