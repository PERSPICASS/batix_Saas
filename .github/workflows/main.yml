name: Deploy to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy App via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << 'EOF'
            cd ${{ vars.PROJECT_DIR }}
            git pull origin dev
            docker compose down
            docker compose up -d --build
          EOF
