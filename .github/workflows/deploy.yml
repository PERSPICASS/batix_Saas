name: Deploy DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true
          script: |
            set -e

            cd /opt/batix/apps/dev/batix_Saas

            echo "=== 1. Mise à jour du code ==="
            git fetch origin dev
            git reset --hard origin/dev

            echo "=== 2. Démarrage / mise à jour des conteneurs ==="
            docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --remove-orphans

            echo "=== 3. Suppression de l'ancien build frontend ==="
            rm -rf public/build

            echo "=== 4. Build frontend ==="
            docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm node sh -lc "
              node -v
              npm -v
              echo NODE_ENV=\$NODE_ENV
              npm ci
              npm run build
            "

            echo "=== 5. Migrations Laravel ==="
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T app php artisan migrate --force

            echo "=== 6. Nettoyage des caches Laravel ==="
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T app php artisan config:clear
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T app php artisan cache:clear
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T app php artisan route:clear
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T app php artisan view:clear

            echo "=== 7. Déploiement terminé avec succès ==="
