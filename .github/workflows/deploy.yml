name: Deploy PROD

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true
          script: |
            set -e

            cd /opt/batix/apps/prod/batix_Saas

            echo "=== 1. Git update ==="
            git fetch origin prod
            git reset --hard origin/prod

            echo "=== 2. Start containers ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== 3. Clean old build ==="
            rm -rf public/build

            echo "=== 4. Build frontend CLEAN ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm node sh -lc "
              node -v
              npm -v

              rm -rf node_modules package-lock.json

              npm install

              npm run build
            "

            echo "=== 5. Laravel migrate ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan migrate --force

            echo "=== 6. Clear cache ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan optimize:clear

            echo "=== Deploy SUCCESS ==="
