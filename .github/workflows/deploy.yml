name: Deploy PROD

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true
          script: |
            set -e

            cd /opt/batix/apps/prod/batix_Saas

            echo "=== 1. Git update ==="
            git fetch origin prod
            git reset --hard origin/prod

            echo "=== 2. Stop containers ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans

            echo "=== 3. Delete public volume ==="
            docker volume rm batix_prod_batix_public || true

            echo "=== 4. Rebuild containers ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== 5. Laravel migrate ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan migrate --force

            echo "=== 6. Clear and optimize cache ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan optimize:clear
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan optimize

            echo "=== 7. Verify build ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app ls -la public/build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx ls -la /var/www/html/public/build

            echo "=== 8. Docker cleanup ==="
            docker system prune -af
            docker builder prune -af

            echo "=== Deploy SUCCESS ==="

      # Un SSR à l'arrêt ne casse rien de visible : le site répond normalement, seul le
      # SEO s'éteint. C'est resté invisible pendant des jours. D'où cette vérification
      # sur le HTML réellement servi — la seule chose qu'un crawler regarde.
      - name: Verify SSR is serving the SEO markup
        run: |
          sleep 15
          html=$(curl -sL --max-time 30 https://batixpro.com/)
          title=$(printf '%s' "$html" | grep -o '<title[^>]*>[^<]*</title>' | head -1)
          ld=$(printf '%s' "$html" | grep -c 'application/ld+json' || true)
          echo "title           : ${title:-<aucun>}"
          echo "json-ld blocks  : $ld"

          if printf '%s' "$title" | grep -q '>BATIXPRO<'; then
            echo "::error::Le SSR ne rend pas : toutes les pages renvoient le titre placeholder. Les crawlers reçoivent une coquille vide. Voir docs/SSR_DEPLOYMENT.md"
            exit 1
          fi

          if [ "$ld" -lt 1 ]; then
            echo "::error::Aucun JSON-LD dans le HTML servi — le service ssr est absent ou arrêté. Voir docs/SSR_DEPLOYMENT.md"
            exit 1
          fi

          echo "SSR OK — le HTML servi contient le vrai titre et $ld bloc(s) JSON-LD."
