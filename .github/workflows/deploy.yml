name: Deploy DEV

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          debug: true
          script: |
            set -e

            cd /opt/batix/apps/dev/batix_Saas
          
            git fetch origin dev
            git reset --hard origin/dev
          
            docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --remove-orphans
          
            rm -rf public/build
          
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T node sh -lc "
              node -v
              npm -v
              echo NODE_ENV=\$NODE_ENV
              npm ci
              ls -la node_modules/.bin | grep tsc || true
              npm run build
            "
          
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T app php artisan config:clear
            docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T app php artisan cache:clear
