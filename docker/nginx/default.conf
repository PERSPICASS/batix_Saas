server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php index.html index.htm;

    # Logging
    access_log /var/log/nginx/laravel_access.log;
    error_log /var/log/nginx/laravel_error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.paddle.com; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net data:; img-src 'self' data: https:; connect-src 'self' https://cdn.paddle.com https://api.paddle.com; frame-src 'self' https://*.paddle.com https://www.loom.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Remove server signature
    server_tokens off;

    # Écrit en dur (`fastcgi_pass app:9000`), un upstream n'est résolu qu'UNE fois, au
    # démarrage de nginx, et l'IP est gardée indéfiniment. Recréer le conteneur `app`
    # seul (`docker compose up -d app`) lui en attribue une nouvelle : nginx continue
    # d'appeler l'ancienne et renvoie 502 jusqu'à son propre redémarrage. Passer par une
    # variable force une re-résolution via le DNS interne de Docker, mise en cache 10s.
    # ipv6=off : le DNS Docker peut renvoyer une AAAA que php-fpm n'écoute pas.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Handle PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files caching
    location ~* ^/(?:css|js|images|fonts)/(.*)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
