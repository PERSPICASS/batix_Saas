<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors ligne — Batix Pro</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 1.5rem;
        }
        .card { max-width: 26rem; text-align: center; }
        .badge {
            width: 4rem; height: 4rem; margin: 0 auto 1.25rem;
            display: flex; align-items: center; justify-content: center;
            border-radius: 9999px; background: #fbbf24; color: #1e293b;
            font-size: 1.75rem; font-weight: 700;
        }
        h1 { font-size: 1.375rem; margin: 0 0 .75rem; }
        p { margin: 0 0 1.5rem; line-height: 1.6; color: #94a3b8; }
        button {
            background: #fbbf24; color: #1e293b; border: 0;
            border-radius: .75rem; padding: .75rem 1.5rem;
            font-size: 1rem; font-weight: 700; cursor: pointer;
        }
        button:hover { background: #f59e0b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">!</div>
        <h1>Vous êtes hors ligne</h1>
        <p>
            Cette page n'a pas encore été consultée sur cet appareil, elle n'est donc pas
            disponible sans réseau. Les pages déjà ouvertes restent accessibles.
        </p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
</body>
</html>
