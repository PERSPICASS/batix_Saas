<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Marque BATIX PRO. Le cube isometrique est trop detaille pour etre retrace
       fidelement en <path> : on embarque le PNG de la marque en data-URI, ce qui
       garde un unique fichier autonome (pas de requete reseau, CSP-safe) et evite
       toute derive par rapport au logo source (public/logo.png).
       Le bleu nuit du logo est passe en blanc pour rester lisible sur le fond. -->
  <rect width="128" height="128" rx="28" fill="#101225"/>
  <image x="0" y="0" width="128" height="128" href="data:image/png;base64,"/>
</svg>
