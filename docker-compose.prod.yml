services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: batix_prod_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TMPDIR=/tmp
      - INERTIA_SSR_ENABLED=true
      - INERTIA_SSR_URL=http://ssr:13714
    volumes:
      - batix_public:/var/www/html/public
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      - ssr
    networks:
      - prod_internal
  ssr:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: batix_prod_ssr
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -lc "node bootstrap/ssr/ssr.js"
    environment:
      - TMPDIR=/tmp
      # Sinon React charge son build de développement, nettement plus lent.
      - NODE_ENV=production
    healthcheck:
      # `node` et pas `curl` : l'étage production de l'image n'embarque pas curl.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:13714/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - prod_internal
  nginx:
    image: nginx:alpine
    container_name: batix_prod_nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - batix_public:/var/www/html/public:ro
      - ./storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.batix_prod.rule=Host(`batixpro.com`)
      - traefik.http.routers.batix_prod.entrypoints=websecure
      - traefik.http.routers.batix_prod.tls=true
      - traefik.http.routers.batix_prod.tls.certresolver=le
      - traefik.http.services.batix_prod.loadbalancer.server.port=80
    networks:
      - web
      - prod_internal
  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: batix_prod_queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -lc "php artisan queue:work --sleep=1 --tries=3 --timeout=90"
    depends_on:
      - app
    environment:
      - TMPDIR=/tmp
    networks:
      - prod_internal

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: batix_prod_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -lc "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - app
    environment:
      - TMPDIR=/tmp
    networks:
      - prod_internal

volumes:
  batix_public:

networks:
  web:
    external: true
    name: web
  prod_internal:
    driver: bridge
